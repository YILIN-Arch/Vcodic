<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VCodic | vibe coding 作品社区</title>
    <meta
      name="description"
      content="发现大家用 AI 做出来的小作品。好玩的、实用的、刚做出来的，都可以直接点开试试看。"
    />
    <link rel="canonical" href="https://vcodic.com/" />
    <meta
      property="og:title"
      content="VCodic - vibe coding 作品社区"
    />
    <meta
      property="og:description"
      content="发现大家用 AI 做出来的小作品，打开就能试试看。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vcodic.com/" />
    <meta property="og:image" content="/social-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="VCodic - vibe coding 作品社区"
    />
    <meta
      name="twitter:description"
      content="发现大家用 AI 做出来的小作品，打开就能试试看。"
    />
    <meta name="theme-color" content="#31e6a1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar reveal">
        <div class="brand">
          <div class="brand-mark">V</div>
          <div class="brand-name">VCodic</div>
        </div>

        <label class="search-shell" for="search-input">
          <span class="search-label">搜索</span>
          <input
            id="search-input"
            type="search"
            placeholder="搜作品、创作者或关键词"
          />
        </label>

      </header>

      <div class="layout">
        <aside class="sidebar reveal" aria-label="作品发现导航">
          <nav class="profile-card discovery-nav" aria-label="VCodic 导航">
            <div class="profile-head">
              <div class="avatar">V</div>
              <div>
                <h2 class="profile-name">VCodic</h2>
                <p class="profile-role">vibe coding 作品社区</p>
              </div>
            </div>

            <a class="action action-mint action-block" href="./submit.html">发布作品</a>

            <div class="category-stack">
              <a class="category-item active" href="#featured-works">
                <span class="category-dot"></span>
                精选作品
              </a>
              <a class="category-item" href="#latest-works">最新作品</a>
              <a class="category-item" href="./submit.html">投稿须知</a>
            </div>
          </nav>
        </aside>

        <main class="content">
          <section class="mobile-profile reveal" aria-label="移动端导航">
            <div class="mobile-profile-main">
              <div class="avatar avatar-small">V</div>
              <div>
                <h2 class="profile-name">VCodic</h2>
                <p class="profile-role">vibe coding 作品社区</p>
              </div>
            </div>
            <div class="mobile-profile-actions">
              <a class="action-link" href="#featured-works">精选作品</a>
              <a class="action-link" href="#latest-works">最新作品</a>
            </div>
            <a class="action action-mint" href="./submit.html">发布作品</a>
          </section>

          <section class="hero reveal" id="featured-works">
            <div class="hero-copy">
              <p class="hero-eyebrow">精选作品</p>
              <h1>发现大家用 AI 做出来的小作品</h1>
              <p class="hero-subtitle">
                好玩的、实用的、刚做出来的，都可以直接点开试试看。
              </p>
            </div>

            <div class="hero-tabs" aria-label="内容排序">
              <button class="sort-pill active" data-sort="featured">精选</button>
              <button class="sort-pill" data-sort="new">最新</button>
            </div>
          </section>

          <section class="feed-section reveal" id="latest-works">
            <div class="section-head">
              <h2>最新作品</h2>
              <p>打开一张卡片，看看这个小作品能做什么。</p>
            </div>
            <div class="works-feed" id="works-feed" aria-live="polite"></div>
          </section>
        </main>
      </div>

      <footer class="site-footer">
        <p>VCodic</p>
        <nav class="footer-links" aria-label="页脚链接">
          <a href="./privacy.html">隐私</a>
          <a href="./terms.html">条款</a>
        </nav>
      </footer>
    </div>

    <script src="./site-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
